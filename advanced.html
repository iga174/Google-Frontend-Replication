<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <style>
            label {
                display: inline-block;
                width: 100px;
                }   

            input[type="text"] {
                width: 300px;
                height: 35px;
                font-size: 20px;
            }

            input[type="submit"] {
                display: block;
                margin-left: 275px;
                height: 47px;
                width: 150px;
                border: 1px solid #f8f9fa;
                border-radius: 30px;
                background-color: rgb(16, 90, 217);
                outline: none;
                color: white;
                cursor: pointer;
                font-size: 15px;
            }


            div {
                margin: 50px auto;
                width: 600px;
            }

            .text {
                font-size: 20px;
            }

            a {
                display: block;
                text-align: right;
                color: black;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            img {
                width: 170px;
            }

            hr {
                border: none;
                border-top: 1px solid #d3d3d3;
                margin: 20px 0;
            }

        </style>
    </head>
    <body>
        <img src="logo.png" alt ="logo">
        <hr>
        <a href="index.html">Google Search</a>
        <div>
        <h2>Advanced Search</h1>
        </div>

        <div class="text">
            Find pages with ...
        </div>

        <form action="https://www.google.com/search">
            <div>
            <label>all these words:</label>
            <input type="text" name="as_q">
            </div>

            <div>
            <label>this exact word or phrase:</label>
            <input type="text" name="as_epq">
            </div>

            <div>
            <label>any of these words:</label>
            <input type="text" name="as_oq">
            </div>
            
            <div>
            <label>none of these words:</label>
             <input type="text" name="as_eq">
            </div>

            <div>
            <input type="submit" value="Advanced Search">
            </div>

        </form>
    </body>
</html>
