<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image Search</title>
        <style>
        h1 {
                text-align: center;
                margin-top: 250px;
                margin-bottom: 32px;
                font-family: "Product Sans", sans-serif;
                font-size: 90px;
                font-weight: 400;
                letter-spacing: -3px;
            }

            .header span:nth-child(1),
            .header span:nth-child(4) {
                color: #4581FF;
            }

            .header span:nth-child(2),
            .header span:nth-child(6) {
                color: red;
            }

            .header span:nth-child(3) {
                color: #F5B027;
            }

            .header span:nth-child(5) {
                color: #59BF54;
            }

            form {
                text-align: center;
            }

            input[type="text"] {
                width: 600px;
                height: 45px;
                font-size: 25px;
                border-radius: 25px;
                border: 1px solid #dfe1e5;
                outline: none;
                padding: 0 20px;  
            }

            input[type="submit"] {
                display: block;
                margin: 20px auto;
                padding: 8px 15px;
                border: 1px solid #f8f9fa;
                border-radius: 10px;
                background-color: #f8f9fa;
                cursor: pointer;
                outline: none;
                font-size: 15px;
            }

            input[type="submit"]:hover,
            input[type="submit"]:focus {
                box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            }

            a {
                display: block;
                text-align: right;
                color: black;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            img {
                width: 270px;
                display: block;
                margin: 230px auto;
                margin-bottom: 40px;
            }

        </style>
    </head>
    <body>
        <a href="index.html">Google Search</a>
        <img src="images_logo.svg.webp" alt = logo>
        <form action="https://www.google.com/search">
            <input type="text" name="q">
            <input type="hidden" name="tbm" value="isch">
            <input type="submit" value="Google Search">
        </form>
    </body>
</html>
